<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aisle Buddy — Blinkit Category Discovery MVP</title>
<style>
:root{--y:#F8CB46;--g:#0B3D2E;--g2:#11503C;--add:#318616;--ink:#1F2430;--mut:#7A867E;--bg:#F6F7F4;--red:#B4452F;--ok:#1E7A46;--amb:#8A6D00}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:110px}
.hdr{background:var(--y);padding:14px 16px 12px;position:sticky;top:0;z-index:20}
.mx{max-width:680px;margin:0 auto}
.brand{font-weight:800;font-size:18px;color:var(--g)}.brand span{font-weight:600;font-size:13px}
.deliv{font-size:12px;font-weight:800;color:var(--g)}.loc{font-size:11px;color:#5a5324}
.tabs{display:flex;gap:6px}.tab{border:0;padding:7px 12px;border-radius:99px;font-size:12px;font-weight:800;cursor:pointer;background:#fff8dd;color:var(--g)}
.tab.on{background:var(--g);color:var(--y)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
main{max-width:680px;margin:0 auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);margin-top:16px}
.lbl{font-size:11.5px;font-weight:800;color:var(--g)}.lbl small{font-weight:500;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid #D6DED6;background:#fff;color:#3B4A42;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--g);color:var(--y);border-color:var(--g)}
.sec{font-weight:800;color:var(--g);margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
.p{background:#fff;border-radius:14px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);display:flex;flex-direction:column}
.p .e{font-size:28px}.p .n{font-size:12px;font-weight:600;flex:1;margin-top:4px;line-height:1.3}.p .u{font-size:10.5px;color:var(--mut)}
.p .b{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.pr{font-weight:800;font-size:13px}
.addb{border:1.5px solid var(--add);color:var(--add);background:#F7FFF2;font-weight:800;font-size:11px;padding:5px 12px;border-radius:9px;cursor:pointer}
.qty{display:flex;align-items:center;background:var(--add);border-radius:9px;overflow:hidden}
.qty button{border:0;background:transparent;color:#fff;font-weight:800;padding:4px 9px;font-size:14px;cursor:pointer}
.qty span{color:#fff;font-weight:800;font-size:12px;padding:0 2px}
.cartbar{position:fixed;left:0;right:0;bottom:0;padding:0 16px 16px;z-index:30}
.cartbar button{width:100%;max-width:680px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;background:var(--add);color:#fff;border:0;border-radius:16px;padding:13px 18px;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.cartbar small{font-weight:600;opacity:.9;font-size:11px}
.ci{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #F0F2EF}
.ci:last-child{border-bottom:0}.ci .nm{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.ab{background:var(--g);border-radius:16px;overflow:hidden;margin-top:16px;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.ab .top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px 4px}
.ab .k{color:var(--y);font-size:11px;font-weight:800;letter-spacing:2px}
.bud{display:flex;gap:4px}.bud button{border:0;border-radius:99px;font-size:10.5px;font-weight:800;padding:3px 9px;cursor:pointer;background:var(--g2);color:#C9DAD0}
.bud button.on{background:var(--y);color:var(--g)}
.ab .body{padding:8px 14px 14px}.ab p{color:#C9DAD0;font-size:13px}
.ybtn{width:100%;border:0;background:var(--y);color:var(--g);font-weight:800;font-size:13.5px;padding:11px;border-radius:12px;cursor:pointer;margin-top:10px}
.pick .t1{color:#fff;font-weight:800;font-size:15px}.pick .t2{color:#9DB8AA;font-size:11.5px}
.pick .why{color:#EDF3EF;font-style:italic;font-size:13px;margin-top:8px}
.trust{background:var(--g2);color:#C9DAD0;font-size:11.5px;border-radius:10px;padding:8px 10px;margin-top:8px}
.duo{display:flex;gap:8px;margin-top:12px}
.duo button{flex:1;border-radius:12px;font-weight:800;font-size:13px;padding:9px;cursor:pointer}
.acc{border:0;background:var(--y);color:var(--g)}
.dis{background:transparent;border:1px solid #9DB8AA;color:#DCE6E0}
.rsn{border:1px solid #9DB8AA;color:#DCE6E0;background:transparent;border-radius:99px;font-size:11px;font-weight:700;padding:6px 11px;cursor:pointer}
.mutg{color:#9DB8AA;font-size:11px;margin-top:8px}
.bill{font-size:13px}.bill .r{display:flex;justify-content:space-between;padding:2px 0}
.bill .tot{border-top:1px solid #F0F2EF;margin-top:6px;padding-top:8px;font-weight:800}
.stat{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--g)}.stat span{font-size:10.5px;font-weight:700;color:#5A6B60}
.bar{height:10px;border-radius:99px;background:#EDF1ED;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px}
.foot{color:var(--mut);font-size:11.5px;line-height:1.5;margin-top:16px;padding:0 2px}
.empty{text-align:center;padding:34px 14px}
.hide{display:none!important}
</style></head><body>
<div class="hdr"><div class="mx row">
  <div><div class="brand">Blinkit <span>× Aisle Buddy</span></div><div class="deliv">⚡ Delivery in 16 minutes</div><div class="loc">HSR Layout, Bengaluru ▾</div></div>
  <div class="tabs"><button class="tab on" data-v="shop">🏪 Shop</button><button class="tab" data-v="cart">🛒 Cart<span id="cartN"></span></button><button class="tab" data-v="pm">📊 PM view</button></div>
</div></div>
<main>
<section id="v-shop">
  <div class="card"><div class="lbl">SHOPPING FOR SOMETHING SPECIAL? <small>(helps Aisle Buddy pick smarter)</small></div><div class="chips" id="occ"></div></div>
  <div class="sec">Your usual aisles</div><div class="grid" id="staples"></div>
</section>
<section id="v-cart" class="hide"></section>
<section id="v-pm" class="hide"></section>
</main>
<div class="cartbar hide" id="cartbar"><button onclick="go('cart')"><span id="cbL"></span><span>View cart → <small>(Aisle Buddy lives there ✨)</small></span></button></div>
<script>
const STAPLES=[["Amul Taaza Milk 500ml",33,"🥛","500 ml"],["White Eggs 6 pcs",48,"🥚","6 pcs"],["Brown Bread 400g",45,"🍞","400 g"],["Maggi Noodles 4-pack",56,"🍜","280 g"],["Lay's India's Magic Masala",20,"🥔","48 g"],["Coca-Cola 750ml",45,"🥤","750 ml"],["Amul Butter 100g",62,"🧈","100 g"],["Fresh Curd 400g",35,"🥣","400 g"],["Onions 1kg",40,"🧅","1 kg"],["Tomatoes 1kg",38,"🍅","1 kg"],["Bananas 6 pcs",42,"🍌","6 pcs"],["Paneer 200g",95,"🧀","200 g"],["Aashirvaad Atta 5kg",270,"🌾","5 kg"],["Tata Salt 1kg",28,"🧂","1 kg"],["Surf Excel 1kg",135,"🧺","1 kg"],["Tissue Rolls 2-pack",85,"🧻","2 pcs"],["Green Chilli 100g",12,"🌶️","100 g"],["Vanilla Ice Cream Tub",199,"🍨","700 ml"]];
const CAT=[
["Farmley Peri Peri Makhana 40g","Gourmet Snacks",99,"🍿","single small pack — nothing wasted if it's not your thing",["snack","party","late"]],
["The Whole Truth Protein Bar 52g","Health Foods",60,"🍫","one sealed bar — the lowest-stakes first taste of the aisle",["gym","health"]],
["Blue Tokai Easy Pour Coffee 5-pack","Gourmet Beverages",150,"☕","sachet trial of a specialty roaster — brew one, judge for yourself",["coffee","rain","morning"]],
["Vahdam Turmeric Ashwagandha Tea 15 bags","Wellness",199,"🍵","sealed export-grade pack; small enough to just try",["health","selfcare","rain"]],
["Mamaearth Vitamin C Face Wash 100ml","Beauty & Personal Care",249,"🧴","sealed bestseller with visible expiry on pack — easy refund if seal is broken",["selfcare","gift"]],
["Minimalist Sunscreen SPF50 25g","Beauty & Personal Care",199,"🌞","mini size made exactly for first trials",["selfcare"]],
["Plum BodyLovin' Body Mist 60ml","Beauty & Personal Care",225,"🌸","travel size — try the fragrance without the full-bottle risk",["gift","selfcare"]],
["Pedigree Adult Chicken 400g","Pet Care",120,"🐶","small sealed pack to test acceptance before committing to bulk",["pet"]],
["The Moms Co. Baby Wash 100ml","Baby Care",174,"👶","trial size, sealed, dermat-tested line",["baby"]],
["Engage On-the-Go Perfume 30ml","Personal Care",190,"💨","pocket size — low-risk way into the fragrance aisle",["gift"]],
["Jimmy's Whiskey Sour Mixer 250ml","Gourmet Beverages",99,"🍹","single chilled can — party-test one before buying a case",["party"]],
["Jade Forest Tonic Water 250ml","Gourmet Beverages",90,"🫧","single can, sealed and dated",["party"]],
["MasterChow Schezwan Chutney 200g","Gourmet Pantry",175,"🌶️","starter jar with clear expiry date on the label",["cook","snack"]],
["Wingreens Peri Peri Mayo 180g","Gourmet Pantry",99,"🥫","starter pack — one snack session is enough to judge it",["snack","party"]],
["Bagrry's Crunchy Muesli 425g","Health Foods",240,"🥣","sealed breakfast pack with long shelf life",["health","morning"]],
["Yoga Bar Multigrain Bar 38g","Health Foods",45,"🌱","single bar at pocket change — zero commitment",["gym","health","snack"]],
["boAt Type-C Cable 1.5m","Electronics",249,"🔌","sealed retail box with standard brand warranty",["util"]],
["Eveready LED Bulb 9W","Home & Electricals",99,"💡","sealed box, replace-on-arrival if defective",["util"]],
["Classmate Notebook 172 pages","Stationery",60,"📓","exactly what it says on the cover",["gift","util"]],
["Dettol Disinfectant Spray 170g","Home Hygiene",235,"🫧","sealed trusted brand — an easy first step past groceries",["clean"]],
["Kama Ayurveda Rose Water 50ml","Beauty & Personal Care",275,"🌹","mini of a premium brand — sealed with batch date",["selfcare","gift"]],
["Sleepy Owl Hot Brew Bags 10-pack","Gourmet Beverages",299,"🦉","starter pack; brew bags keep it foolproof",["coffee","rain","morning"]],
["Happilo Californian Almonds 200g","Dry Fruits",249,"🥜","small vacuum-sealed pack with visible packing date",["health","gift","snack"]],
["Epigamia Greek Yogurt Blueberry 85g","Gourmet Dairy",60,"🫐","single cup, cold-chain delivered with date on lid",["health","snack","dairy"]],
["Paper Boat Aamras 180ml","Beverages",35,"🥭","single serve — the smallest possible yes",["snack","party"]],
["Nivea Soft Cream 25ml","Personal Care",55,"🤲","mini tin — try before the full jar",["selfcare","rain"]],
["Gala Spin Mop Refill","Home Care",199,"🧹","standard fit refill, sealed",["clean","util"]],
["Fevicreate Craft Kit Mini","Kids & Hobby",149,"🎨","starter kit sized for one rainy afternoon",["kids","gift","rain"]],
["Bombay Shaving Co. Razor","Grooming",149,"🪒","sealed starter razor — the grooming aisle's easiest entry",["selfcare","gift"]]];
const OCC=[["🎉 Guests tonight","party"],["💪 Starting gym","gym"],["🌧️ Rainy evening","rain"],["🎁 Need a small gift","gift"],["🧘 Self-care Sunday","selfcare"]];
const REASONS=["Too pricey","Don't trust freshness/quality","Not interested","Already have it"];
let cart={},occ="",budget=299,sug=null,sugState="idle",basketKey="",showReasons=false;
let M=JSON.parse(localStorage.getItem("ab-metrics")||'{"shown":0,"accepted":0,"dismissed":0,"reasons":{}}');
const save=()=>localStorage.setItem("ab-metrics",JSON.stringify(M));
const $=id=>document.getElementById(id);const J=s=>s.replace(/'/g,"\\'");
function go(v){document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));["shop","cart","pm"].forEach(x=>$("v-"+x).classList.toggle("hide",x!==v));if(v==="cart")renderCart();if(v==="pm")renderPM();$("cartbar").classList.toggle("hide",v!=="shop"||!count());}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>go(t.dataset.v));
const count=()=>Object.values(cart).reduce((a,v)=>a+v.q,0);
const itemTotal=()=>Object.values(cart).reduce((a,v)=>a+v.q*v.p,0);
function add(n,p,e){cart[n]?cart[n].q++:cart[n]={q:1,p,e};bump();}
function sub(n){if(!cart[n])return;cart[n].q<=1?delete cart[n]:cart[n].q--;bump();}
function bump(){const k=Object.keys(cart).sort().join("|");if(k!==basketKey){sugState="idle";sug=null;showReasons=false;}renderStaples();renderTopbar();if(!$("v-cart").classList.contains("hide"))renderCart();}
function renderTopbar(){$("cartN").textContent=count()?` (${count()})`:"";const bar=$("cartbar");if(count()&&!$("v-shop").classList.contains("hide")){bar.classList.remove("hide");$("cbL").textContent=`${count()} item${count()>1?"s":""} · ₹${itemTotal()}`;}else bar.classList.add("hide");}
function renderStaples(){$("staples").innerHTML=STAPLES.map(([n,p,e,u])=>{const c=cart[n];return `<div class="p"><div class="e">${e}</div><div class="n">${n}</div><div class="u">${u}</div><div class="b"><div class="pr">₹${p}</div>${c?`<div class="qty"><button onclick="sub('${J(n)}')">−</button><span>${c.q}</span><button onclick="add('${J(n)}',${p},'${e}')">+</button></div>`:`<button class="addb" onclick="add('${J(n)}',${p},'${e}')">ADD</button>`}</div></div>`;}).join("");}
function renderOcc(){$("occ").innerHTML=OCC.map(([l,k])=>`<button class="chip ${occ===k?"on":""}" onclick="setOcc('${k}')">${l}</button>`).join("");}
function setOcc(k){occ=occ===k?"":k;sugState="idle";sug=null;renderOcc();if(!$("v-cart").classList.contains("hide"))renderCart();}
// ——— On-device recommendation engine (portable prototype build) ———
function signals(){const names=Object.keys(cart).join(" ").toLowerCase();const s=new Set();
if(/maggi|lay's|coca|ice cream/.test(names))s.add("snack");
if(/coca|lay's/.test(names)&&/maggi|ice cream/.test(names))s.add("late");
if(/milk|curd|paneer/.test(names))s.add("dairy");
if(/atta|onion|tomato|paneer|salt|chilli|butter|egg/.test(names))s.add("cook");
if(/surf|tissue/.test(names))s.add("clean");
if(/bread|egg|milk|banana/.test(names))s.add("morning");
if(/ice cream/.test(names))s.add("party");return s;}
function inBasketCats(){const n=Object.keys(cart).join(" ").toLowerCase();const ex=new Set();if(/makhana/.test(n))ex.add("Gourmet Snacks");if(/milk|curd/.test(n))ex.add("Gourmet Dairy")/*still allow greek yogurt? exclude to be safe*/;return ex;}
function hashStr(s){let h=0;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return h;}
function recommend(){const s=signals(),ex=inBasketCats();
const pool=CAT.filter(c=>c[2]<=budget&&!ex.has(c[1]));
const scored=pool.map(c=>{let sc=1;if(occ&&c[5].includes(occ))sc+=4;c[5].forEach(t=>{if(t!==occ&&s.has(t))sc+=2;});if(c[2]<=120)sc+=1;return[sc,c];}).sort((a,b)=>b[0]-a[0]);
const top=scored.filter(x=>x[0]===scored[0][0]);
const pickIdx=hashStr(basketKey+occ+budget)%top.length;
const c=top[pickIdx][1];
const first=Object.keys(cart)[0]||"your list";
const occText={party:"guests coming over",gym:"the new gym routine",rain:"a rainy evening in",gift:"a small gift hunt",selfcare:"a self-care day"}[occ];
const why=occText?`Since it's ${occText}, ${c[0].split(" ").slice(0,3).join(" ")} slots right in — one new aisle, zero detour from your plan.`:`With ${first} in your basket, ${c[0].split(" ").slice(0,3).join(" ")} is the one nearby aisle worth a first taste tonight.`;
return{name:c[0],cat:c[1],price:c[2],emoji:c[3],why:why,trust:"Low-risk by design: "+c[4]+".",tag:occText?("for "+occText):"basket-matched pick"};}
function showPick(){basketKey=Object.keys(cart).sort().join("|");sug=recommend();sugState="shown";M.shown++;save();renderCart();}
function accept(){if(sugState!=="shown")return;add(sug.name,sug.price,sug.emoji);sugState="capped";M.accepted++;save();renderCart();}
function openReasons(){showReasons=true;renderCart();}
function dismiss(r){if(sugState!=="shown")return;M.dismissed++;M.reasons[r]=(M.reasons[r]||0)+1;save();sugState="capped";showReasons=false;renderCart();}
function renderCart(){const v=$("v-cart");if(!count()){v.innerHTML=`<div class="card empty"><div style="font-size:36px">🛒</div><div style="font-weight:800;color:var(--g);margin-top:8px">Your cart is empty</div><div style="color:var(--mut);font-size:13px;margin-top:4px">Add your usual items from the Shop tab — Aisle Buddy appears here at cart review.</div></div>`;return;}
const items=Object.entries(cart).map(([n,c])=>`<div class="ci"><div class="nm"><span style="font-size:20px">${c.e}</span>${n}</div><div style="display:flex;align-items:center;gap:10px"><div class="qty"><button onclick="sub('${J(n)}')">−</button><span>${c.q}</span><button onclick="add('${J(n)}',${c.p},'${c.e}')">+</button></div><b style="font-size:13px;width:52px;text-align:right">₹${c.q*c.p}</b></div></div>`).join("");
const it=itemTotal(),df=it>=199?0:25,hf=4,tot=it+df+hf;
let abBody="";
if(sugState==="idle")abBody=`<p>One pick per basket. Trial-size, budget-capped, and explained — never a carousel.</p><button class="ybtn" onclick="showPick()">Show my pick</button>`;
else if(sug){abBody=`<div class="pick"><div style="display:flex;gap:10px;align-items:flex-start"><div style="font-size:32px">${sug.emoji}</div><div><div class="t1">${sug.name}</div><div class="t2">${sug.cat} · ₹${sug.price} · ${sug.tag}</div></div></div><p class="why">“${sug.why}”</p><div class="trust">🛡 ${sug.trust}</div>${sugState==="shown"&&!showReasons?`<div class="duo"><button class="acc" onclick="accept()">Add · ₹${sug.price}</button><button class="dis" onclick="openReasons()">Not today</button></div>`:""}${sugState==="shown"&&showReasons?`<div class="mutg">Quick one — why not? (this teaches the engine)</div><div class="chips">${REASONS.map(r=>`<button class="rsn" onclick="dismiss('${J(r)}')">${r}</button>`).join("")}</div>`:""}${sugState==="capped"?`<div class="mutg">✓ Logged. One suggestion per basket — change the basket to see a new pick.</div>`:""}</div>`;}
v.innerHTML=`<div class="card"><div style="font-size:11.5px;font-weight:800;color:var(--mut)">⚡ Delivery in 16 minutes · ${count()} items</div>${items}</div>
<div class="ab"><div class="top"><span class="k">✨ ONE NEW AISLE FOR YOU</span><div class="bud">${[99,199,299].map(b=>`<button class="${budget===b?"on":""}" onclick="setBudget(${b})">≤₹${b}</button>`).join("")}</div></div><div class="body">${abBody}</div></div>
<div class="card bill"><div style="font-weight:800;color:var(--g);margin-bottom:6px">Bill details</div><div class="r"><span>Item total</span><span>₹${it}</span></div><div class="r"><span>Delivery fee ${it>=199?"(free over ₹199)":""}</span><span>${df===0?"FREE":"₹"+df}</span></div><div class="r"><span>Handling fee</span><span>₹${hf}</span></div><div class="r tot"><span>To pay</span><span>₹${tot}</span></div></div>`;}
function recWhy(){return sug.why;}
function setBudget(b){budget=b;if(sugState==="shown")sugState="idle";renderCart();}
function renderPM(){const rate=M.shown?Math.round(M.accepted/M.shown*100):0;const rs=Object.entries(M.reasons);
$("v-pm").innerHTML=`<div class="card"><div style="font-weight:800;color:var(--g)">📊 PM instrumentation — live from this deployment</div><div style="font-size:11.5px;color:var(--mut);margin-top:2px">Every event persists in this browser. The MVP measures its own primary metric.</div>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px"><div class="stat"><b>${M.shown}</b><span>Suggestions shown</span></div><div class="stat"><b>${M.accepted}</b><span>Added to cart</span></div><div class="stat"><b>${M.dismissed}</b><span>Dismissed</span></div></div>
<div style="margin-top:16px;display:flex;justify-content:space-between;font-size:13px;font-weight:800"><span>Suggestion → add rate</span><span style="color:${rate>=8?"var(--ok)":"var(--red)"}">${rate}% <small style="font-weight:600;color:var(--mut)">/ target ≥8%</small></span></div>
<div class="bar"><i style="width:${Math.min(rate,100)}%;background:${rate>=8?"var(--ok)":"var(--red)"}"></i></div>
<div style="margin-top:18px;font-size:13px;font-weight:800">Dismissal reasons — testing the trust hypothesis (H2)</div>
${rs.length?rs.map(([r,n])=>`<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-top:6px"><span>${r}</span><span>${n}</span></div><div class="bar" style="height:7px"><i style="width:${(n/Math.max(M.dismissed,1))*100}%;background:${/trust|fresh/i.test(r)?"var(--red)":"var(--amb)"}"></i></div>`).join(""):`<div style="font-size:12px;color:var(--mut);margin-top:4px">No dismissals logged yet.</div>`}
<div style="font-size:11px;font-style:italic;color:var(--mut);margin-top:8px">If “Don't trust freshness/quality” dominates, H2 (trust deficit) is confirmed in-product — the same signal the evidence corpus predicts.</div>
<button class="chip" style="margin-top:14px" onclick="if(confirm('Reset metrics?')){M={shown:0,accepted:0,dismissed:0,reasons:{}};save();renderPM();}">Reset metrics</button></div>
<div class="foot"><b>How it works:</b> the recommendation engine reads the live basket, stated occasion and budget cap against a 30-item catalog of trial-size products actually sold on Blinkit, and returns one pick with a “why you” and a trust note. Hard cap: one suggestion per basket. <i>This portable demo runs the engine fully on-device; the production architecture described in the case study uses an LLM for the same reasoning step.</i></div>`;}
renderOcc();renderStaples();renderTopbar();
</script></body></html>
